name: glop-statistiques

services:
  statistiques-api:
    image: ghcr.io/glop2026shoploc/statistiques:${TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://statistiques-db:5432/statistiques
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      statistiques-db:
        condition: service_healthy
    networks: [statistiques-net, network-mss]

  statistiques-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: statistiques
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - statistiques-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d statistiques"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [statistiques-net]   

networks:
  statistiques-net: {}           
  network-mss:
    external: true       
volumes:
  statistiques-db-data: {}
