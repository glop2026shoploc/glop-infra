name: glop-users

services:
  users-api:
    image: ghcr.io/glop2026shoploc/users:${TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      users-db:
        condition: service_healthy
    networks: [users-net, network-mss]

  users-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d users"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [users-net]

networks:
  users-net: {}
  network-mss:
    external: true

volumes:
  users-db-data: {}